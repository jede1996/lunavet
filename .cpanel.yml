---
# ============================================================
#  LunaVet — Deploy Frontend a cPanel (Git Version Control)
#  Documentación: https://docs.cpanel.net/cpanel/files/git-version-control/
#
#  Flujo:
#    1. Haz push a la rama main
#    2. En cPanel → Git Version Control → Deploy HEAD Commit
#    3. Este script instala dependencias, compila y despliega
# ============================================================

deployment:
  tasks:
    # ---------------------------------------------------------
    # 1. Instalar dependencias del frontend
    # ---------------------------------------------------------
    - /usr/local/bin/node --version
    - cd frontend && /usr/local/bin/npm install --omit=dev

    # ---------------------------------------------------------
    # 2. Compilar el frontend (genera frontend/dist/)
    # ---------------------------------------------------------
    - cd frontend && /usr/local/bin/npm run build

    # ---------------------------------------------------------
    # 3. Copiar el build al directorio público
    #    Ajusta si tu dominio usa un subdirectorio
    #    (ej. /home/$USER/public_html/app)
    # ---------------------------------------------------------
    - export DEPLOYPATH=/home/$USER/public_html
    - /bin/rm -rf $DEPLOYPATH/assets
    - /bin/cp -r frontend/dist/. $DEPLOYPATH/

    # ---------------------------------------------------------
    # 4. Crear .htaccess para React Router (SPA fallback)
    #    Redirige todas las rutas al index.html para que
    #    react-router-dom maneje la navegación en el cliente.
    # ---------------------------------------------------------
    - |
      cat > /home/$USER/public_html/.htaccess << 'EOF'
      Options -MultiViews
      RewriteEngine On
      RewriteCond %{REQUEST_FILENAME} !-f
      RewriteCond %{REQUEST_FILENAME} !-d
      RewriteRule ^ index.html [QSA,L]
      EOF
