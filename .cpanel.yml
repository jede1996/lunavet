---
# ============================================================
#  LunaVet — Deploy Frontend a cPanel (Git Version Control)
#  Ref: https://docs.cpanel.net/knowledge-base/web-services/guide-to-git-deployment/
#
#  Flujo (pull deployment):
#    1. git push origin main         (desde tu máquina)
#    2. cPanel → "Update from Remote"
#    3. cPanel → "Deploy HEAD Commit"
#
#  Nota: cada tarea es un proceso bash independiente.
#        Las variables exportadas NO persisten entre tareas.
# ============================================================

deployment:
  tasks:
    # 1. Instalar dependencias del frontend
    - cd $HOME/repositories/luna_vet_front && cd frontend && npm install

    # 2. Compilar el frontend (genera frontend/dist/)
    - cd $HOME/repositories/luna_vet_front && cd frontend && npm run build

    # 3. Limpiar archivos anteriores del public_html (excepto .htaccess y archivos del backend)
    - /bin/rm -rf $HOME/public_html/assets

    # 4. Copiar el build al directorio público
    - /bin/cp -r $HOME/repositories/luna_vet_front/frontend/dist/. $HOME/public_html/

    # 5. Crear/actualizar .htaccess para React Router (SPA fallback)
    - /bin/cp $HOME/repositories/luna_vet_front/frontend/.htaccess $HOME/public_html/.htaccess
