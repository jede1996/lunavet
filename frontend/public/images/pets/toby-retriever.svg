<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgToby" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
    <linearGradient id="goldFur" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>
  <!-- Background Circle -->
  <circle cx="150" cy="150" r="145" fill="url(#bgToby)" stroke="#f59e0b" stroke-width="4"/>

  <!-- Golden Retriever Illustration -->
  <g transform="translate(0, 10)">
    <!-- Ears -->
    <path d="M 65 100 Q 40 160 85 185 Q 95 140 85 105 Z" fill="#b45309"/>
    <path d="M 235 100 Q 260 160 215 185 Q 205 140 215 105 Z" fill="#b45309"/>

    <!-- Head -->
    <ellipse cx="150" cy="130" rx="70" ry="60" fill="url(#goldFur)"/>

    <!-- Forehead highlight -->
    <ellipse cx="150" cy="105" rx="35" ry="30" fill="#fde68a" opacity="0.6"/>

    <!-- Snout & Muzzle -->
    <ellipse cx="150" cy="165" rx="42" ry="34" fill="#fef3c7"/>
    
    <!-- Nose -->
    <path d="M 136 148 C 142 145, 158 145, 164 148 C 168 156, 156 166, 150 166 C 144 166, 132 156, 136 148 Z" fill="#1e293b"/>
    <ellipse cx="145" cy="151" rx="2.5" ry="1.5" fill="#64748b"/>

    <!-- Mouth -->
    <path d="M 150 166 L 150 178 M 150 178 Q 138 186 130 178 M 150 178 Q 162 186 170 178" stroke="#1e293b" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- Pink Tongue -->
    <path d="M 144 180 Q 150 200 156 180 Z" fill="#f43f5e"/>

    <!-- Warm Loving Eyes -->
    <ellipse cx="118" cy="120" rx="9" ry="11" fill="#451a03"/>
    <ellipse cx="182" cy="120" rx="9" ry="11" fill="#451a03"/>
    <!-- Catchlights -->
    <circle cx="115" cy="117" r="3.5" fill="#ffffff"/>
    <circle cx="179" cy="117" r="3.5" fill="#ffffff"/>

    <!-- Eyebrows -->
    <path d="M 108 104 Q 120 100 128 106" stroke="#92400e" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <path d="M 192 104 Q 180 100 172 106" stroke="#92400e" stroke-width="3.5" fill="none" stroke-linecap="round"/>

    <!-- Blue Collar & Tag -->
    <path d="M 90 205 Q 150 225 210 205 L 215 225 Q 150 248 85 225 Z" fill="#2563eb"/>
    <circle cx="150" cy="235" r="14" fill="#fbbf24"/>
    <text x="144" y="240" font-family="sans-serif" font-size="14" font-weight="900" fill="#78350f">★</text>
  </g>
</svg>
