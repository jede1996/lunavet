<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgBeagle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff7ed"/>
      <stop offset="100%" stop-color="#ffedd5"/>
    </linearGradient>
    <linearGradient id="beagleTan" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
  </defs>
  <circle cx="150" cy="150" r="145" fill="url(#bgBeagle)" stroke="#ea580c" stroke-width="4"/>

  <g transform="translate(0, 10)">
    <!-- Long Droopy Beagle Ears -->
    <path d="M 60 95 Q 35 170 85 195 Q 95 145 85 95 Z" fill="url(#beagleTan)"/>
    <path d="M 240 95 Q 265 170 215 195 Q 205 145 215 95 Z" fill="url(#beagleTan)"/>

    <!-- Head with White Blaze -->
    <ellipse cx="150" cy="130" rx="68" ry="60" fill="url(#beagleTan)"/>
    <!-- Central White Blaze Stripe -->
    <polygon points="140,80 160,80 168,160 132,160" fill="#ffffff"/>

    <!-- Gentle Brown Hound Eyes -->
    <ellipse cx="120" cy="120" rx="9" ry="11" fill="#451a03"/>
    <ellipse cx="180" cy="120" rx="9" ry="11" fill="#451a03"/>
    <circle cx="117" cy="117" r="3.5" fill="#ffffff"/>
    <circle cx="177" cy="117" r="3.5" fill="#ffffff"/>

    <!-- Muzzle -->
    <ellipse cx="150" cy="165" rx="38" ry="30" fill="#ffffff"/>
    <path d="M 138 148 C 142 145, 158 145, 162 148 C 166 156, 156 165, 150 165 C 144 165, 134 156, 138 148 Z" fill="#1e293b"/>
    <path d="M 150 165 L 150 178 M 150 178 Q 138 185 132 178 M 150 178 Q 162 185 168 178" stroke="#1e293b" stroke-width="2.5" fill="none" stroke-linecap="round"/>

    <!-- Orange Collar -->
    <path d="M 90 205 Q 150 225 210 205 L 215 225 Q 150 248 85 225 Z" fill="#0284c7"/>
    <circle cx="150" cy="235" r="12" fill="#fbbf24"/>
  </g>
</svg>
