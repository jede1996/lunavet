<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#2e1065"/>
      <stop offset="100%" stop-color="#3b0764"/>
    </linearGradient>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4338ca"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Background Card -->
  <rect width="400" height="400" rx="32" fill="url(#bgGrad)"/>
  
  <!-- Subtle Glow -->
  <circle cx="200" cy="190" r="140" fill="#6366f1" opacity="0.15" filter="blur(30px)"/>

  <!-- Product Box 3D perspective -->
  <g filter="url(#shadow)">
    <!-- Box Body -->
    <rect x="70" y="85" width="260" height="230" rx="16" fill="url(#boxGrad)"/>
    
    <!-- Top Decorative Header Strip -->
    <path d="M 70 101 A 16 16 0 0 1 86 85 L 314 85 A 16 16 0 0 1 330 101 L 330 135 L 70 135 Z" fill="#312e81"/>
    
    <!-- Brand Title -->
    <text x="88" y="122" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="22" font-weight="800" fill="#ffffff" letter-spacing="1">NexGard</text>
    <text x="210" y="122" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="20" font-weight="400" font-style="italic" fill="#38bdf8">SPECTRA</text>

    <!-- Subtitle Weight Badge -->
    <rect x="88" y="148" width="145" height="26" rx="13" fill="url(#goldGrad)"/>
    <text x="98" y="166" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="700" fill="#1e1b4b">7.5 a 15 kg (M)</text>

    <!-- Chewable Tablet Graphic -->
    <g transform="translate(255, 175)">
      <ellipse cx="25" cy="25" rx="32" ry="24" fill="#92400e" opacity="0.9"/>
      <ellipse cx="23" cy="22" rx="30" ry="22" fill="#b45309"/>
      <ellipse cx="21" cy="20" rx="26" ry="18" fill="#d97706"/>
      <text x="10" y="25" font-family="sans-serif" font-size="11" font-weight="bold" fill="#fef3c7">🍖 Chew</text>
    </g>

    <!-- Benefit Badges -->
    <g transform="translate(88, 190)">
      <circle cx="12" cy="12" r="10" fill="#22c55e" opacity="0.2"/>
      <path d="M7 12 L10 15 L17 8" stroke="#22c55e" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <text x="28" y="16" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="600" fill="#e0e7ff">Pulgas y Garrapatas</text>

      <circle cx="12" cy="40" r="10" fill="#22c55e" opacity="0.2"/>
      <path d="M7 40 L10 43 L17 36" stroke="#22c55e" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <text x="28" y="44" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="600" fill="#e0e7ff">Gusano del Corazón</text>

      <circle cx="12" cy="68" r="10" fill="#22c55e" opacity="0.2"/>
      <path d="M7 68 L10 71 L17 64" stroke="#22c55e" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <text x="28" y="72" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="600" fill="#e0e7ff">Nematodos Intestinales</text>
    </g>

    <!-- Bottom Strip -->
    <rect x="70" y="285" width="260" height="30" rx="0" fill="#1e1b4b"/>
    <text x="88" y="305" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="700" fill="#94a3b8" letter-spacing="0.5">AFIDOXOLANER + MILBEMICINA OXIMA</text>
  </g>

  <!-- Official Quality Seal -->
  <g transform="translate(305, 75)">
    <circle cx="18" cy="18" r="22" fill="#0ea5e9"/>
    <text x="6" y="22" font-family="sans-serif" font-size="11" font-weight="900" fill="#fff">ORIGINAL</text>
  </g>
</svg>
