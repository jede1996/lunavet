<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgRoyal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#450a0a"/>
      <stop offset="50%" stop-color="#1c1917"/>
      <stop offset="100%" stop-color="#0c0a09"/>
    </linearGradient>
    <linearGradient id="bagRoyal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <filter id="shadowRoyal" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="400" height="400" rx="32" fill="url(#bgRoyal)"/>
  <circle cx="200" cy="200" r="140" fill="#dc2626" opacity="0.15" filter="blur(30px)"/>

  <g filter="url(#shadowRoyal)">
    <!-- Main Sack -->
    <path d="M 120 70 L 280 70 L 305 320 L 95 320 Z" fill="url(#bagRoyal)"/>
    <polygon points="120,70 140,55 260,55 280,70" fill="#dc2626"/>
    <rect x="135" y="52" width="130" height="8" rx="4" fill="#ef4444"/>

    <!-- Red Banner -->
    <rect x="105" y="85" width="190" height="42" rx="4" fill="#dc2626"/>
    <text x="118" y="112" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="16" font-weight="900" fill="#ffffff" letter-spacing="1">ROYAL CANIN</text>

    <!-- Prescription Cross -->
    <g transform="translate(185, 140)">
      <rect x="10" y="0" width="10" height="30" fill="#2563eb" rx="3"/>
      <rect x="0" y="10" width="30" height="10" fill="#2563eb" rx="3"/>
    </g>

    <!-- Formula Subtitle -->
    <text x="125" y="195" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14" font-weight="900" fill="#0f172a" text-anchor="middle">GASTROINTESTINAL</text>
    <text x="200" y="215" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="700" fill="#dc2626" text-anchor="middle">VETERINARY DIET</text>

    <!-- Stomach icon / protection -->
    <circle cx="200" cy="255" r="24" fill="#fee2e2"/>
    <text x="190" y="262" font-size="20">🩺</text>

    <!-- Weight Tag -->
    <rect x="115" y="290" width="170" height="22" rx="4" fill="#1e293b"/>
    <text x="155" y="306" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="700" fill="#ffffff">CANINE 2 KG</text>
  </g>
</svg>
