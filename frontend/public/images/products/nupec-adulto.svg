<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgNupec" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="bagNupec" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <filter id="shadowNupec" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="400" height="400" rx="32" fill="url(#bgNupec)"/>
  <circle cx="200" cy="200" r="140" fill="#3b82f6" opacity="0.15" filter="blur(30px)"/>

  <!-- Pet Food Bag Shape -->
  <g filter="url(#shadowNupec)">
    <!-- Main Sack -->
    <path d="M 120 70 L 280 70 L 305 320 L 95 320 Z" fill="url(#bagNupec)"/>
    <!-- Top Pinch/Fold -->
    <polygon points="120,70 140,55 260,55 280,70" fill="#172554"/>
    <rect x="135" y="52" width="130" height="8" rx="4" fill="#60a5fa"/>

    <!-- Gold Label Header -->
    <rect x="110" y="95" width="180" height="55" rx="8" fill="#ffffff"/>
    <text x="130" y="132" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="28" font-weight="900" fill="#1e3a8a" letter-spacing="2">NUPEC</text>
    <text x="235" y="125" font-family="sans-serif" font-size="10" font-weight="bold" fill="#f59e0b">★ 90%</text>
    <text x="235" y="138" font-family="sans-serif" font-size="8" fill="#64748b">DIGESTIBLE</text>

    <!-- Formula Subtitle -->
    <rect x="130" y="165" width="140" height="24" rx="12" fill="#f59e0b"/>
    <text x="145" y="181" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="800" fill="#451a03">ADULTO MEDIANO</text>

    <!-- Dog silhouette & Bowl -->
    <circle cx="200" cy="235" r="32" fill="#172554" opacity="0.6"/>
    <!-- Kibble pieces -->
    <ellipse cx="185" cy="245" rx="7" ry="5" fill="#d97706"/>
    <ellipse cx="200" cy="240" rx="6" ry="6" fill="#b45309"/>
    <ellipse cx="215" cy="246" rx="8" ry="5" fill="#f59e0b"/>
    <ellipse cx="198" cy="252" rx="7" ry="4" fill="#92400e"/>
    <text x="180" y="228" font-size="18">🐕</text>

    <!-- Weight Tag -->
    <rect x="115" y="285" width="170" height="25" rx="6" fill="#0f172a" opacity="0.9"/>
    <text x="142" y="302" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="700" fill="#ffffff">CONT. NET. 5 KG</text>
  </g>
</svg>
