<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgTrama" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#450a0a"/>
      <stop offset="50%" stop-color="#280505"/>
      <stop offset="100%" stop-color="#140202"/>
    </linearGradient>
    <linearGradient id="bottleDark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#451a03"/>
      <stop offset="50%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>
    <filter id="shadowTrama" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>
  <rect width="400" height="400" rx="32" fill="url(#bgTrama)"/>
  <circle cx="200" cy="200" r="140" fill="#ef4444" opacity="0.15" filter="blur(30px)"/>

  <g filter="url(#shadowTrama)">
    <rect x="185" y="45" width="30" height="40" rx="6" fill="#dc2626"/>
    <rect x="175" y="85" width="50" height="15" rx="4" fill="#991b1b"/>

    <rect x="145" y="100" width="110" height="190" rx="16" fill="url(#bottleDark)"/>

    <!-- Warning Band: Controlled Substance -->
    <rect x="145" y="108" width="110" height="12" fill="#ef4444"/>
    <text x="200" y="118" font-family="sans-serif" font-size="7" font-weight="900" fill="#ffffff" text-anchor="middle">CONTROLADO SSA / SENASICA</text>

    <!-- Medical Label -->
    <rect x="155" y="128" width="90" height="142" rx="6" fill="#ffffff" opacity="0.95"/>
    <rect x="155" y="128" width="90" height="24" rx="0" fill="#dc2626"/>
    <text x="200" y="145" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="900" fill="#ffffff" text-anchor="middle">TRAMADOL</text>

    <text x="200" y="172" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="800" fill="#991b1b" text-anchor="middle">GOTAS ORALES</text>
    <text x="200" y="188" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10" font-weight="700" fill="#0f172a" text-anchor="middle">50 MG / ML</text>

    <rect x="162" y="200" width="76" height="16" rx="8" fill="#fee2e2"/>
    <text x="200" y="212" font-family="sans-serif" font-size="8" font-weight="bold" fill="#dc2626" text-anchor="middle">RECETA RETENIDA</text>

    <text x="200" y="238" font-family="sans-serif" font-size="16" text-anchor="middle">🛡️</text>
    <text x="200" y="258" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10" font-weight="800" fill="#64748b" text-anchor="middle">10 ML</text>
  </g>
</svg>
