<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradBrav" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="50%" stop-color="#022c22"/>
      <stop offset="100%" stop-color="#041f17"/>
    </linearGradient>
    <linearGradient id="boxGradBrav" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <filter id="shadowBrav" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <rect width="400" height="400" rx="32" fill="url(#bgGradBrav)"/>
  <circle cx="200" cy="190" r="140" fill="#10b981" opacity="0.15" filter="blur(30px)"/>

  <g filter="url(#shadowBrav)">
    <rect x="70" y="85" width="260" height="230" rx="16" fill="url(#boxGradBrav)"/>
    <path d="M 70 101 A 16 16 0 0 1 86 85 L 314 85 A 16 16 0 0 1 330 101 L 330 135 L 70 135 Z" fill="#065f46"/>

    <text x="88" y="122" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="24" font-weight="800" fill="#ffffff" letter-spacing="1">BRAVECTO</text>
    <text x="245" y="120" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="700" fill="#a7f3d0">12 SEMANAS</text>

    <!-- 12 Weeks Protection Badge -->
    <g transform="translate(88, 148)">
      <rect width="130" height="26" rx="13" fill="#f59e0b"/>
      <text x="12" y="18" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="800" fill="#451a03">10 a 20 kg</text>
    </g>

    <!-- Dog silhouette & Chew -->
    <g transform="translate(245, 160)">
      <ellipse cx="35" cy="40" rx="32" ry="24" fill="#78350f"/>
      <ellipse cx="33" cy="38" rx="28" ry="20" fill="#92400e"/>
      <text x="16" y="42" font-family="sans-serif" font-size="11" font-weight="bold" fill="#fef3c7">🍖 1 Tab</text>
    </g>

    <!-- Features -->
    <g transform="translate(88, 190)">
      <circle cx="10" cy="12" r="8" fill="#ffffff" opacity="0.25"/>
      <path d="M6 12 L9 15 L15 8" stroke="#ffffff" stroke-width="2.2" fill="none" stroke-linecap="round"/>
      <text x="24" y="16" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="600" fill="#ecfdf5">3 meses sin garrapatas</text>

      <circle cx="10" cy="38" r="8" fill="#ffffff" opacity="0.25"/>
      <path d="M6 38 L9 41 L15 34" stroke="#ffffff" stroke-width="2.2" fill="none" stroke-linecap="round"/>
      <text x="24" y="42" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="600" fill="#ecfdf5">Efecto rápido en 8 hrs</text>

      <circle cx="10" cy="64" r="8" fill="#ffffff" opacity="0.25"/>
      <path d="M6 64 L9 67 L15 60" stroke="#ffffff" stroke-width="2.2" fill="none" stroke-linecap="round"/>
      <text x="24" y="68" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="600" fill="#ecfdf5">No se va con el agua</text>
    </g>

    <rect x="70" y="285" width="260" height="30" rx="0" fill="#064e3b"/>
    <text x="88" y="305" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="700" fill="#a7f3d0" letter-spacing="0.5">FLURALANER COMPRIMIDO MASTICABLE</text>
  </g>
</svg>
