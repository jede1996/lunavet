<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgShamp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#042f2e"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="bottleShamp" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="50%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <filter id="shadowShamp" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="400" height="400" rx="32" fill="url(#bgShamp)"/>
  <circle cx="200" cy="200" r="140" fill="#14b8a6" opacity="0.15" filter="blur(30px)"/>

  <g filter="url(#shadowShamp)">
    <!-- Pump Top -->
    <rect x="188" y="45" width="24" height="25" rx="3" fill="#ffffff"/>
    <path d="M 175 45 L 225 45 L 235 55 L 165 55 Z" fill="#e2e8f0"/>
    <path d="M 165 55 L 140 60 L 140 65 L 165 62 Z" fill="#94a3b8"/>
    <rect x="180" y="70" width="40" height="15" rx="4" fill="#0f766e"/>

    <!-- Bottle Body -->
    <path d="M 150 85 Q 200 78 250 85 L 260 300 Q 200 315 140 300 Z" fill="url(#bottleShamp)"/>
    
    <!-- White Label -->
    <rect x="155" y="125" width="90" height="150" rx="10" fill="#ffffff" opacity="0.95"/>
    
    <!-- Logo LunaVet -->
    <circle cx="200" cy="155" r="16" fill="#0f766e"/>
    <text x="193" y="161" font-size="16">🌿</text>

    <text x="200" y="185" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="800" fill="#0f766e" text-anchor="middle">LUNA-VET</text>
    <text x="200" y="200" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10" font-weight="900" fill="#0f172a" text-anchor="middle">SHAMPOO</text>
    <text x="200" y="215" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="9" font-weight="700" fill="#dc2626" text-anchor="middle">ANTIPULGAS</text>

    <!-- Formula tags -->
    <rect x="165" y="228" width="70" height="14" rx="7" fill="#ccfbf1"/>
    <text x="200" y="239" font-family="sans-serif" font-size="8" font-weight="bold" fill="#0f766e" text-anchor="middle">NEEM &amp; ALOE</text>

    <text x="200" y="260" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10" font-weight="700" fill="#64748b" text-anchor="middle">500 ML</text>
  </g>
</svg>
